<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPSCL — Hourly DC/SG Data</title>
<style>
  html{ scroll-behavior:smooth; }
  :root{
    /* neutral dark charcoal grey — no blue tint */
    --bg:#19191c;
    --bg-2:#1f1f22;
    --panel:#242428;
    --panel-2:#1e1e21;
    --border:#38383e;
    --text:#ececee;
    --muted:#9b9ba3;
    --accent:#f0b043;
    --accent-ink:#1c1204;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  }
  html[data-theme="light"]{
    /* light neutral grey */
    --bg:#f1f2f5;
    --bg-2:#f8f9fb;
    --panel:#ffffff;
    --panel-2:#f5f6f8;
    --border:#dee1e7;
    --text:#1b2330;
    --muted:#66707e;
    --accent:#e2932a;
    --accent-ink:#1c1204;
    --shadow: 0 10px 26px -14px rgba(20,30,45,.16);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button, .theme-toggle, input{ outline:none; }
  button:focus-visible, .theme-toggle:focus-visible, input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(1100px 500px at 90% -10%, var(--bg-2), transparent),
      var(--bg);
    color:var(--text);
    padding:26px 28px 40px;
    scrollbar-width:thin;
    scrollbar-color: var(--border) transparent;
  }
  body::-webkit-scrollbar{ width:10px; }
  body::-webkit-scrollbar-track{ background:transparent; }
  body::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:999px;
    border:2px solid var(--bg);
    transition:background .2s ease;
  }
  body::-webkit-scrollbar-thumb:hover{ background:var(--accent); }

  /* disable the browser's default view-transition crossfade —
     we drive the clip-path animation ourselves */
  ::view-transition-old(root),
  ::view-transition-new(root){
    animation:none;
    mix-blend-mode:normal;
  }

  @keyframes breathe-label{
    0%{ transform:scale(1); }
    50%{ transform:scale(.88); }
    100%{ transform:scale(1); }
  }
  @keyframes breathe-btn{
    0%{ transform:scale(1); }
    50%{ transform:scale(.86); }
    100%{ transform:scale(1); }
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }
  .logo-wrap{
    display:inline-flex;
    cursor:default;
    transition:transform .25s ease;
    flex:0 0 auto;
  }
  .logo-wrap:hover{ transform:scale(1.09); }
  .logo-wrap svg{ display:block; width:132px; height:40px; }
  .brand-text{ min-width:0; }
  .brand-text h1{
    font-size:18px;
    letter-spacing:.2px;
    margin:0;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand-text .tag{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ---------- theme toggle: one clickable pebble switch ---------- */
  .theme-toggle{
    position:relative;
    width:68px;
    height:36px;
    border-radius:999px;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    cursor:pointer;
    user-select:none;
    transition:background .35s ease, border-color .35s ease;
    overflow:visible;
    flex:0 0 auto;
  }
  html[data-theme="light"] .theme-toggle{
    background:linear-gradient(135deg,#e3e5ea,#f6f7f9);
  }
  html[data-theme="dark"] .theme-toggle{
    background:linear-gradient(135deg,#1f1f22,#2d2d32);
  }
  .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (hover:hover) and (pointer:fine){
    .theme-toggle:hover{ border-color:var(--accent); }
  }

  .theme-toggle .star{
    position:absolute;
    width:2.5px; height:2.5px;
    border-radius:50%;
    background:#fff;
    opacity:0;
    transition:opacity .3s ease;
  }
  .theme-toggle .star.s1{ top:9px; left:14px; }
  .theme-toggle .star.s2{ top:20px; left:20px; }
  html[data-theme="dark"] .theme-toggle .star{ opacity:.85; }

  .theme-toggle .thumb{
    position:absolute;
    top:3px;
    left:3px;
    width:28px;
    height:28px;
    border-radius:50%;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
    transition:transform .28s cubic-bezier(.4,0,.2,1), background .3s ease;
    z-index:2;
  }
  html[data-theme="light"] .theme-toggle .thumb{ background:var(--accent); }
  html[data-theme="dark"] .theme-toggle .thumb{ background:#eef2f8; transform:translateX(32px); }

  .theme-toggle .thumb::before{
    content:'';
    position:absolute;
    inset:-7px;
    border-radius:50%;
    background:repeating-conic-gradient(var(--accent) 0deg 4deg, transparent 4deg 45deg);
    opacity:0;
    transform:scale(.55);
    transition:opacity .25s ease, transform .25s ease;
    z-index:-1;
  }
  html[data-theme="light"] .theme-toggle .thumb::before{
    opacity:.9;
    transform:scale(1);
  }

  .theme-toggle .thumb::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle at 32% 30%, rgba(20,30,55,.22) 0 16%, transparent 17%),
      radial-gradient(circle at 65% 55%, rgba(20,30,55,.16) 0 11%, transparent 12%),
      radial-gradient(circle at 45% 72%, rgba(20,30,55,.14) 0 9%, transparent 10%);
    opacity:0;
    transition:opacity .25s ease;
  }
  html[data-theme="dark"] .theme-toggle .thumb::after{ opacity:1; }

  /* ---------- panels ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .controls-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
  }
  .btn-group{ display:flex; gap:10px; flex-wrap:wrap; }

  /* ---------- buttons: neutral surface, motion-driven feedback ---------- */
  button.action{
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--border);
    padding:9px 20px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  button.action .btn-label{
    display:inline-block;
    transition:transform .15s ease;
  }
  button.action:active:not(:disabled){
    border-color:var(--accent);
    background:var(--panel);
  }
  button.action:active:not(:disabled) .btn-label{ animation:breathe-label 50ms ease-in-out; }
  @media (hover:hover) and (pointer:fine){
    button.action:hover:not(:disabled){
      transform:translateY(-2px);
      border-color:var(--accent);
      box-shadow:var(--shadow);
    }
    button.action:hover:not(:disabled) .btn-label{ transform:scale(1.08); }
  }
  button.action:disabled{
    opacity:.4;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }

  /* date selector */
  .date-nav{
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .date-nav button.arrow{
    width:34px;
    height:34px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s ease, color .15s ease, transform .15s ease;
  }
  .date-nav button.arrow:active:not(:disabled){
    animation:breathe-btn 50ms ease-in-out;
    border-color:var(--accent);
    color:var(--accent);
  }
  @media (hover:hover) and (pointer:fine){
    .date-nav button.arrow:hover:not(:disabled){
      border-color:var(--accent);
      color:var(--accent);
      transform:translateY(-2px) scale(1.08);
    }
  }
  .date-nav button.arrow:disabled{
    opacity:.35;
    cursor:not-allowed;
    border-color:var(--border);
    color:var(--muted);
    transform:none;
  }
  .date-nav input[type="date"]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:999px;
    padding:7px 38px 7px 14px;
    font-size:13px;
    font-family:inherit;
    color-scheme: dark;
    -webkit-appearance:none;
    appearance:none;
  }
  html[data-theme="light"] .date-nav input[type="date"]{ color-scheme: light; }
  /* fully suppress the browser's own indicator (which can render as a plain
     down-arrow rather than a calendar glyph, and inconsistently at that) —
     keep the tap zone functional but invisible, and draw one consistent
     calendar icon on top instead */
  .date-nav input[type="date"]::-webkit-calendar-picker-indicator{
    position:absolute;
    right:0; top:0;
    width:38px; height:100%;
    margin:0;
    padding:0;
    background:transparent;
    -webkit-appearance:none;
    appearance:none;
    opacity:0;
    cursor:pointer;
  }
  .date-input-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
  }
  .date-input-wrap .date-icon{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color:var(--muted);
    pointer-events:none;
  }

  .status{ color:var(--muted); font-size:12px; margin-top:10px; }

  /* ---------- table ---------- */
  .table-wrap{
    overflow-x:auto;
    overflow-y:auto;
    border:1px solid var(--border);
    border-radius:12px;
    max-height:70vh;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color: var(--border) transparent;
  }
  .table-wrap::-webkit-scrollbar{ width:10px; height:10px; }
  .table-wrap::-webkit-scrollbar-track{ background:transparent; }
  .table-wrap::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:999px;
    border:2px solid var(--panel);
    background-clip:padding-box;
    transition:background .2s ease;
  }
  .table-wrap::-webkit-scrollbar-thumb:hover{ background:var(--accent); }
  .table-wrap::-webkit-scrollbar-corner{ background:transparent; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td{
    padding:8px 11px;
    text-align:right;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){
    text-align:left;
  }
  th{
    color:var(--muted);
    font-weight:700;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.03em;
    position:sticky;
    top:0;
    background:var(--panel);
  }
  tbody tr:hover td{ background:var(--panel-2); }
  td.rosa-total, th.rosa-total{
    color:var(--accent);
    font-weight:700;
  }
  tr.missing-row td{
    background:var(--panel-2);
    color:var(--muted);
  }
  .empty-state{
    padding:34px 16px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }

  /* ---------- live chart overlay ---------- */
  .chart-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:100;
  }
  .chart-overlay[hidden]{ display:none; }
  .chart-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    width:min(1150px, 100%);
    max-height:92vh;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:18px 20px 20px;
  }
  .chart-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .chart-panel-head h2{ margin:0; font-size:16px; }
  .chart-panel-head .chart-sub{ color:var(--muted); font-size:12px; margin-top:2px; }
  .chart-close{
    width:32px;
    height:32px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    transition:border-color .15s ease, color .15s ease;
  }
  .chart-close:active{ border-color:var(--accent); color:var(--accent); }
  @media (hover:hover) and (pointer:fine){
    .chart-close:hover{ border-color:var(--accent); color:var(--accent); }
  }
  .chart-canvas-wrap{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    height:min(60vh, 520px);
  }
  @media (max-width:640px){
    .chart-overlay{ padding:10px; }
    .chart-panel{ padding:14px; border-radius:14px; }
    .chart-canvas-wrap{ height:52vh; }
  }

  /* ---------- mobile: single-row header, single-row controls ---------- */
  @media (max-width:640px){
    body{ padding:14px 12px 26px; }
    .topbar{ flex-wrap:nowrap; gap:10px; margin-bottom:16px; }
    .brand{ gap:8px; flex:1 1 auto; }
    .logo-wrap svg{ width:88px; height:27px; }
    .brand-text h1{ font-size:13.5px; text-align:center; }
    .brand-text{ flex:1 1 auto; }
    .brand-text .tag{ display:none; }
    .theme-toggle{ width:52px; height:28px; }
    .theme-toggle .thumb{ width:20px; height:20px; top:3px; left:3px; }
    html[data-theme="dark"] .theme-toggle .thumb{ transform:translateX(24px); }

    .panel{ padding:12px; border-radius:14px; }
    .controls-row{
      flex-direction:column;
      align-items:stretch;
      flex-wrap:nowrap;
      gap:10px;
    }
    .btn-group{
      width:100%;
      flex-wrap:nowrap;
      gap:8px;
    }
    .btn-group button.action{ flex:1 1 0; padding:10px 6px; font-size:11.5px; white-space:nowrap; text-align:center; }
    .date-nav{ width:100%; flex-wrap:nowrap; justify-content:center; }
    .date-input-wrap{ flex:1 1 auto; }
    .date-nav input[type="date"]{ width:100%; padding:8px 34px 8px 10px; font-size:12.5px; min-height:36px; text-align:center; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="logo-wrap" title="RPSCL">
      <svg viewBox="0 0 132 40" xmlns="http://www.w3.org/2000/svg">
        <polygon points="8,2 2,20 9,20 5,38 20,16 12,16 17,2" fill="var(--accent)"/>
        <text x="27" y="27" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="800" letter-spacing="1" fill="var(--text)">RPSCL</text>
      </svg>
    </span>
    <div class="brand-text">
      <h1>Hourly DC / SG Data</h1>
      <div class="tag">Generator declared capacity, schedule &amp; actuals</div>
    </div>
  </div>

  <div class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="Toggle dark mode" tabindex="0">
    <span class="star s1"></span>
    <span class="star s2"></span>
    <span class="thumb"></span>
  </div>
</div>

<div class="panel">
  <div class="controls-row">
    <div class="btn-group">
      <button class="action" onclick="loadData()"><span class="btn-label">Refresh</span></button>
      <button class="action" id="downloadBtn" onclick="downloadCSV()"><span class="btn-label">Download CSV</span></button>
      <button class="action" onclick="openLiveChart()"><span class="btn-label">Live Chart</span></button>
    </div>
    <div class="date-nav">
      <button class="arrow" id="prevDay" onclick="stepDate(-1)" aria-label="Previous day">&#8249;</button>
      <span class="date-input-wrap">
        <input type="date" id="dateInput" min="2026-08-23">
        <svg class="date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="16" rx="2.5"/>
          <path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
        </svg>
      </span>
      <button class="arrow" id="nextDay" onclick="stepDate(1)" aria-label="Next day">&#8250;</button>
    </div>
  </div>
  <div class="status" id="status">Loading...</div>
</div>

<div class="panel">
  <div class="table-wrap">
    <table id="dataTable">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>
</div>

<div class="chart-overlay" id="chartOverlay" hidden>
  <div class="chart-panel" role="dialog" aria-modal="true" aria-label="Live chart">
    <div class="chart-panel-head">
      <div>
        <h2>Live Chart — Actual Generation</h2>
        <div class="chart-sub" id="chartSub"></div>
      </div>
      <button class="chart-close" id="chartCloseBtn" aria-label="Close chart">&#10005;</button>
    </div>
    <div class="chart-canvas-wrap">
      <canvas id="liveChartCanvas"></canvas>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
const CSV_PATH = 'upsldc_hourly_data.csv';
const MIN_DATE = new Date(2026, 7, 23); // 23-Aug-2026, months are 0-indexed
function today(){ const t = new Date(); t.setHours(0,0,0,0); return t; }

let allRows = [];      // array of row arrays (excluding header)
let rawHeader = [];    // original header cells
let displayHeader = []; // formatted header cells, with Rosa Total columns inserted
let rosaColIdx = { dc:[-1,-1], sg:[-1,-1], ag:[-1,-1] };
let insertAfterIdx = -1;
let timeColIdx = 1;
let currentRawCSVForDate = ''; // csv text for the currently selected date, for download
let selectedISO = '';

function parseCSV(text){
  return text.trim().split('\n').map(line => line.split(','));
}

function normalizeHeader(h){
  return h.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
}

function formatHeaderLabel(h){
  const words = h.trim().replace(/_/g,' ').split(/\s+/);
  return words.map(w=>{
    const up = w.toUpperCase();
    if(up === 'DC' || up === 'SG' || up === 'AG') return up;
    if(/^\d+$/.test(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(' ');
}

// Parses a CSV-style date cell like "23-Aug-2026" or "23-Aug-26" into a Date object.
function parseCellDate(cell){
  const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const m = cell.trim().match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2}|\d{4})$/);
  if(!m) return null;
  const mon = months[m[2].toLowerCase()];
  if(mon === undefined) return null;
  let year = parseInt(m[3],10);
  if(m[3].length === 2) year += 2000; // 2-digit year: assume 21st century
  return new Date(year, mon, parseInt(m[1],10));
}

function isoOf(d){
  const y = d.getFullYear();
  const mo = String(d.getMonth()+1).padStart(2,'0');
  const da = String(d.getDate()).padStart(2,'0');
  return `${y}-${mo}-${da}`;
}

// hour prefix ("01".."23","00") from a time cell like "17:20"
function hourOf(cell){
  const m = cell.trim().match(/^(\d{1,2}):/);
  if(!m) return null;
  return m[1].padStart(2,'0');
}

async function loadData(silent){
  const status = document.getElementById('status');
  if(!silent) status.textContent = 'Loading...';
  try{
    const res = await fetch(CSV_PATH + '?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    rawHeader = rows[0] || [];
    allRows = rows.slice(1).filter(r => r.length === rawHeader.length);

    buildHeaderPlan();

    // default selection is always today's date, clamped to the allowed range
    let defaultDate = today();
    if(defaultDate < MIN_DATE) defaultDate = MIN_DATE;

    const dateInput = document.getElementById('dateInput');
    dateInput.max = isoOf(today());
    if(!dateInput.value){
      dateInput.value = isoOf(defaultDate);
    }
    renderForSelectedDate();
    status.textContent = 'Last refreshed ' + new Date().toLocaleTimeString();
  }catch(err){
    // stay silent — no CSV yet is a normal, expected state, not an error to surface
    status.textContent = '';
    document.getElementById('downloadBtn').disabled = true;
    document.getElementById('bodyRows').innerHTML = '';
    document.getElementById('headRow').innerHTML = '';
  }
}

function buildHeaderPlan(){
  displayHeader = rawHeader.map(formatHeaderLabel);
  rosaColIdx = { dc:[-1,-1], sg:[-1,-1], ag:[-1,-1] };
  insertAfterIdx = -1;
  timeColIdx = 1;

  rawHeader.forEach((h, i)=>{
    const n = normalizeHeader(h);
    if(n === 'TIME') timeColIdx = i;
    if(n === 'ROSA1DC') rosaColIdx.dc[0] = i;
    if(n === 'ROSA2DC') rosaColIdx.dc[1] = i;
    if(n === 'ROSA1SG') rosaColIdx.sg[0] = i;
    if(n === 'ROSA2SG') rosaColIdx.sg[1] = i;
    if(n === 'ROSA1AG') rosaColIdx.ag[0] = i;
    if(n === 'ROSA2AG') rosaColIdx.ag[1] = i;
    if(n === 'ROSA2AG') insertAfterIdx = i;
  });
}

function addRosaTotals(row){
  if(insertAfterIdx === -1) return row.slice();
  const out = row.slice(0, insertAfterIdx + 1);
  const totals = ['dc','sg','ag'].map(key=>{
    const [i1, i2] = rosaColIdx[key];
    if(i1 === -1 || i2 === -1) return '';
    const a = parseFloat(row[i1]);
    const b = parseFloat(row[i2]);
    if(isNaN(a) || isNaN(b)) return '';
    return String(a + b);
  });
  return out.concat(totals, row.slice(insertAfterIdx + 1));
}

function stepDate(delta){
  const input = document.getElementById('dateInput');
  const cur = input.valueAsDate || MIN_DATE;
  const next = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + delta);
  if(next < MIN_DATE || next > today()) return;
  input.value = isoOf(next);
  renderForSelectedDate();
}

// Chronological 01:00 -> 00:00 (24 hour) slot list for a day.
function fullDayHourSlots(){
  const slots = [];
  for(let h = 1; h <= 23; h++) slots.push(String(h).padStart(2,'0'));
  slots.push('00');
  return slots;
}

function renderForSelectedDate(){
  const input = document.getElementById('dateInput');
  const sel = input.valueAsDate;
  if(!sel) return;
  selectedISO = isoOf(sel);

  document.getElementById('prevDay').disabled = (selectedISO <= isoOf(MIN_DATE));
  document.getElementById('nextDay').disabled = (selectedISO >= isoOf(today()));

  const rowsForDate = allRows.filter(r=>{
    const d = parseCellDate(r[0]);
    return d && isoOf(d) === selectedISO;
  });

  const headRow = document.getElementById('headRow');
  const bodyRows = document.getElementById('bodyRows');
  const downloadBtn = document.getElementById('downloadBtn');
  const status = document.getElementById('status');

  if(rowsForDate.length === 0){
    headRow.innerHTML = '';
    bodyRows.innerHTML = '<tr><td class="empty-state" colspan="1">No data logged for this date yet.</td></tr>';
    downloadBtn.disabled = true;
    currentRawCSVForDate = '';
    status.textContent = 'No data logged for ' + selectedISO + ' yet.';
    return;
  }

  // map hour -> ALL matching rows (a hydrated CSV can have more than one entry per hour)
  const byHour = {};
  rowsForDate.forEach(r=>{
    const hr = hourOf(r[timeColIdx] || '');
    if(hr){
      if(!byHour[hr]) byHour[hr] = [];
      byHour[hr].push(r);
    }
  });
  Object.keys(byHour).forEach(hr=>{
    byHour[hr].sort((a,b)=> (a[timeColIdx]||'').localeCompare(b[timeColIdx]||'', undefined, {numeric:true}));
  });

  const fullHeader = insertAfterIdx === -1
    ? displayHeader
    : displayHeader.slice(0, insertAfterIdx + 1).concat(['Rosa Total DC','Rosa Total SG','Rosa Total AG'], displayHeader.slice(insertAfterIdx + 1));

  headRow.innerHTML = fullHeader.map((h,i)=>{
    const isRosaTotal = insertAfterIdx !== -1 && i > insertAfterIdx && i <= insertAfterIdx + 3;
    return `<th${isRosaTotal ? ' class="rosa-total"' : ''}>${h}</th>`;
  }).join('');

  // Trim to the span between the first and last hour that actually has data —
  // no placeholder rows before the first entry or after the most recent one.
  const allSlots = fullDayHourSlots(); // chronological 01..23,00
  const dataIdxs = allSlots
    .map((hr, i) => (byHour[hr] && byHour[hr].length ? i : -1))
    .filter(i => i >= 0);
  const firstIdx = Math.min(...dataIdxs);
  const lastIdx = Math.max(...dataIdxs);
  const slots = allSlots.slice(firstIdx, lastIdx + 1); // smallest time first

  const slotRows = [];
  slots.forEach(hr=>{
    const arr = byHour[hr];
    if(arr && arr.length){
      arr.forEach(raw => slotRows.push({ missing:false, cells: addRosaTotals(raw) }));
    } else {
      const blank = new Array(fullHeader.length).fill('');
      blank[timeColIdx] = hr + ':00';
      slotRows.push({ missing:true, cells: blank });
    }
  });

  bodyRows.innerHTML = slotRows.map(entry=>{
    const rowClass = entry.missing ? ' class="missing-row"' : '';
    const tds = entry.cells.map((c,i)=>{
      const isRosaTotal = insertAfterIdx !== -1 && i > insertAfterIdx && i <= insertAfterIdx + 3;
      return `<td${isRosaTotal ? ' class="rosa-total"' : ''}>${c}</td>`;
    }).join('');
    return `<tr${rowClass}>${tds}</tr>`;
  }).join('');

  // CSV mirrors the same trimmed range; missing hours inside it are fully empty rows,
  // and hours with multiple logged entries include all of them.
  const csvSlotRows = [];
  slots.forEach(hr=>{
    const arr = byHour[hr];
    if(arr && arr.length){
      arr.forEach(raw => csvSlotRows.push(raw));
    } else {
      csvSlotRows.push(new Array(rawHeader.length).fill(''));
    }
  });
  currentRawCSVForDate = [rawHeader.join(',')].concat(csvSlotRows.map(r=>r.join(','))).join('\n');

  downloadBtn.disabled = false;
  status.textContent = 'Loaded ' + rowsForDate.length + ' logged hour(s) for ' + selectedISO + '.';

  updateLiveChartIfOpen(rowsForDate);
}

function downloadCSV(){
  if(!currentRawCSVForDate){ alert('No data loaded yet.'); return; }
  const blob = new Blob([currentRawCSVForDate], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'upsldc_' + selectedISO + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------- live chart: all *_AG series vs time, Total Demand on its own scale ---------- */
let liveChart = null;
let chartOverlayOpen = false;

function getAGSeriesMeta(){
  const metas = [];
  rawHeader.forEach((h,i)=>{
    if(i === timeColIdx) return;
    const n = normalizeHeader(h);
    if(n.endsWith('AG')) metas.push({ idx:i, label: formatHeaderLabel(h) });
  });
  return metas;
}

function getTotalDemandIdx(){
  let idx = -1;
  rawHeader.forEach((h,i)=>{ if(normalizeHeader(h) === 'TOTALDEMAND') idx = i; });
  return idx;
}

const CHART_PALETTE = ['#ff6b6b','#4dabf7','#51cf66','#f59f00','#cc5de8','#20c997','#ff922b','#5c7cfa','#ff8fa3','#66d9e8'];

function buildChartData(rowsForDate){
  const sorted = rowsForDate.slice().sort((a,b)=>
    (a[timeColIdx]||'').localeCompare(b[timeColIdx]||'', undefined, {numeric:true})
  );
  const labels = sorted.map(r => r[timeColIdx]);
  const agMetas = getAGSeriesMeta();

  const agDatasets = agMetas.map((m,i)=>({
    label: m.label,
    data: sorted.map(r => parseFloat(r[m.idx])),
    borderColor: CHART_PALETTE[i % CHART_PALETTE.length],
    backgroundColor: CHART_PALETTE[i % CHART_PALETTE.length],
    yAxisID: 'yAG',
    tension: .25,
    borderWidth: 2,
    pointRadius: 3,
    pointHoverRadius: 5,
    spanGaps: true,
  }));

  const demandIdx = getTotalDemandIdx();
  const datasets = agDatasets.slice();
  if(demandIdx >= 0){
    datasets.push({
      label: 'Total Demand',
      data: sorted.map(r => parseFloat(r[demandIdx])),
      borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),
      backgroundColor: 'transparent',
      yAxisID: 'yDemand',
      borderDash: [6,4],
      borderWidth: 2.5,
      tension: .25,
      pointRadius: 2,
      pointHoverRadius: 5,
      spanGaps: true,
    });
  }
  return { labels, datasets };
}

function chartThemeColors(){
  const cs = getComputedStyle(document.documentElement);
  return {
    text: cs.getPropertyValue('--text').trim(),
    muted: cs.getPropertyValue('--muted').trim(),
    border: cs.getPropertyValue('--border').trim(),
    panel: cs.getPropertyValue('--panel').trim(),
  };
}

function buildChartOptions(){
  const c = chartThemeColors();
  return {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 250 },
    interaction: { mode: 'index', intersect: false },
    plugins:{
      legend:{ labels:{ color:c.text, boxWidth:12, usePointStyle:true, font:{ size:11 } } },
      tooltip:{
        backgroundColor:c.panel,
        titleColor:c.text,
        bodyColor:c.text,
        borderColor:c.border,
        borderWidth:1,
        padding:10,
      }
    },
    scales:{
      x:{ ticks:{ color:c.muted, maxRotation:0, autoSkip:true }, grid:{ color:c.border } },
      yAG:{
        position:'left',
        ticks:{ color:c.muted },
        grid:{ color:c.border },
        title:{ display:true, text:'Actual Generation (MW)', color:c.muted }
      },
      yDemand:{
        position:'right',
        ticks:{ color:c.muted },
        grid:{ drawOnChartArea:false },
        title:{ display:true, text:'Total Demand (MW)', color:c.muted }
      },
    }
  };
}

function currentRowsForSelectedDate(){
  return allRows.filter(r=>{
    const d = parseCellDate(r[0]);
    return d && isoOf(d) === selectedISO;
  });
}

function openLiveChart(){
  const rowsForDate = currentRowsForSelectedDate();
  if(rowsForDate.length === 0){ alert('No data to chart for this date yet.'); return; }
  if(typeof Chart === 'undefined'){ alert('Chart library failed to load — check your connection and try again.'); return; }

  const { labels, datasets } = buildChartData(rowsForDate);
  const ctx = document.getElementById('liveChartCanvas').getContext('2d');
  if(liveChart) liveChart.destroy();
  liveChart = new Chart(ctx, { type:'line', data:{ labels, datasets }, options: buildChartOptions() });

  document.getElementById('chartSub').textContent = selectedISO;
  document.getElementById('chartOverlay').hidden = false;
  chartOverlayOpen = true;
}

function closeLiveChart(){
  document.getElementById('chartOverlay').hidden = true;
  chartOverlayOpen = false;
}

function updateLiveChartIfOpen(rowsForDate){
  if(!chartOverlayOpen || !liveChart) return;
  const { labels, datasets } = buildChartData(rowsForDate);
  liveChart.data.labels = labels;
  datasets.forEach((ds,i)=>{
    if(liveChart.data.datasets[i]){
      liveChart.data.datasets[i].data = ds.data;
    } else {
      liveChart.data.datasets[i] = ds;
    }
  });
  liveChart.data.datasets.length = datasets.length;
  liveChart.update();
}

document.getElementById('chartCloseBtn').addEventListener('click', closeLiveChart);
document.getElementById('chartOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'chartOverlay') closeLiveChart();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && chartOverlayOpen) closeLiveChart();
});

/* ---------- theme handling with a swift circular transition from the toggle ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').setAttribute('aria-checked', theme === 'dark' ? 'true' : 'false');
  try{ localStorage.setItem('rpscl-theme', theme); }catch(e){}
  if(chartOverlayOpen && liveChart){
    const c = chartThemeColors();
    liveChart.options.plugins.legend.labels.color = c.text;
    liveChart.options.plugins.tooltip.backgroundColor = c.panel;
    liveChart.options.plugins.tooltip.titleColor = c.text;
    liveChart.options.plugins.tooltip.bodyColor = c.text;
    liveChart.options.plugins.tooltip.borderColor = c.border;
    liveChart.options.scales.x.ticks.color = c.muted;
    liveChart.options.scales.x.grid.color = c.border;
    liveChart.options.scales.yAG.ticks.color = c.muted;
    liveChart.options.scales.yAG.grid.color = c.border;
    liveChart.options.scales.yAG.title.color = c.muted;
    liveChart.options.scales.yDemand.ticks.color = c.muted;
    liveChart.options.scales.yDemand.title.color = c.muted;
    const demandDs = liveChart.data.datasets.find(d => d.label === 'Total Demand');
    if(demandDs) demandDs.borderColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    liveChart.update();
  }
}

function toggleTheme(){
  const toggleEl = document.getElementById('themeToggle');
  const rect = toggleEl.getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top + rect.height / 2;

  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';

  if(!document.startViewTransition){
    applyTheme(newTheme);
    return;
  }

  const transition = document.startViewTransition(() => applyTheme(newTheme));
  transition.ready.then(() => {
    const endRadius = Math.hypot(
      Math.max(x, window.innerWidth - x),
      Math.max(y, window.innerHeight - y)
    );
    const clipPath = [
      `circle(0px at ${x}px ${y}px)`,
      `circle(${endRadius}px at ${x}px ${y}px)`
    ];
    if(newTheme === 'light'){
      document.documentElement.animate(
        { clipPath },
        { duration: 190, easing: 'ease-out', pseudoElement: '::view-transition-new(root)' }
      );
    } else {
      document.documentElement.animate(
        { clipPath: clipPath.slice().reverse() },
        { duration: 190, easing: 'ease-in', pseudoElement: '::view-transition-old(root)' }
      );
    }
  });
}

(function initTheme(){
  // default is always dark unless the user has explicitly chosen light before
  let theme = 'dark';
  try{
    const saved = localStorage.getItem('rpscl-theme');
    if(saved === 'light' || saved === 'dark') theme = saved;
  }catch(e){}
  applyTheme(theme);
})();
const themeToggleEl = document.getElementById('themeToggle');
themeToggleEl.addEventListener('click', toggleTheme);
themeToggleEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleTheme(); }
});
document.getElementById('dateInput').addEventListener('change', renderForSelectedDate);

loadData();
setInterval(() => loadData(true), 60000); // background refresh — updates rows in place, no page reload
</script>
