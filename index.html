<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UPSLDC Hourly Data</title>
<style>
  :root{
    --bg:#0f1720;
    --panel:#16202b;
    --border:#26333f;
    --text:#e6edf3;
    --muted:#8ba0b3;
    --accent:#4fb3a9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  h1{ font-size:20px; margin:0 0 4px 0; }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:20px; }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
  }
  button{
    background:var(--accent);
    color:#06231f;
    border:none;
    padding:9px 16px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    margin-right:10px;
  }
  button.secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
  }
  button:hover{ filter:brightness(1.08); }
  .table-wrap{
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:8px;
    max-height:70vh;
  }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td{
    padding:7px 10px;
    text-align:right;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){
    text-align:left;
  }
  th{
    color:var(--muted);
    font-weight:600;
    font-size:10.5px;
    text-transform:uppercase;
    position:sticky;
    top:0;
    background:var(--panel);
  }
  .status{ color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>

<h1>UPSLDC Hourly Data</h1>
<div class="sub">Updated hourly by a GitHub Actions workflow — see .github/workflows/update-data.yml in this repo.</div>

<div class="panel">
  <button onclick="loadData()">Refresh</button>
  <button onclick="downloadCSV()">Download CSV</button>
  <button class="secondary" onclick="createChart()">Create Chart</button>
  <div class="status" id="status">Loading...</div>
</div>

<div class="panel">
  <div class="table-wrap">
    <table id="dataTable">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>
</div>

<script>
const CSV_PATH = 'upsldc_hourly_data.csv';
let rawCSVText = '';

function parseCSV(text){
  return text.trim().split('\n').map(line => line.split(','));
}

async function loadData(){
  const status = document.getElementById('status');
  try{
    const res = await fetch(CSV_PATH + '?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    rawCSVText = await res.text();
    const rows = parseCSV(rawCSVText);
    renderTable(rows);
    status.textContent = 'Loaded ' + (rows.length - 1) + ' rows. Last refreshed ' + new Date().toLocaleTimeString();
  }catch(err){
    status.textContent = 'Could not load ' + CSV_PATH + ' yet — the first GitHub Actions run may not have completed. (' + err.message + ')';
  }
}

function renderTable(rows){
  if(!rows.length) return;
  const [header, ...body] = rows;
  const headRow = document.getElementById('headRow');
  const bodyRows = document.getElementById('bodyRows');
  headRow.innerHTML = header.map(h => `<th>${h}</th>`).join('');
  bodyRows.innerHTML = body.slice().reverse().map(r =>
    '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>'
  ).join('');
}

function downloadCSV(){
  if(!rawCSVText){ alert('No data loaded yet.'); return; }
  const blob = new Blob([rawCSVText], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'upsldc_hourly_data.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function createChart(){
  // Placeholder -- tell me what you want charted and I'll wire this up.
  alert('Chart coming soon — let me know what you want plotted here.');
}

loadData();
</script>

</body>
</html>
