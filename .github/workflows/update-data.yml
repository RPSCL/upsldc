name: Update UPSLDC Data

on:
  schedule:
    # Runs at minute 0 of every hour, UTC. GitHub may delay this by a
    # few minutes under load -- it is not guaranteed to the second.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated CSV back

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest UPSLDC data
        run: python fetch_upsldc.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add upsldc_hourly_data.csv
          if git diff --staged --quiet; then
            echo "No new data -- skipping commit."
          else
            git commit -m "Update UPSLDC data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
